<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevAstra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Stale-deploy recovery: after a redeploy, a cached index.html can point
         at hashed bundles that no longer exist, leaving the page blank. If the
         app hasn't mounted within 8s, reload once; the sessionStorage guard
         prevents an infinite reload loop on genuinely broken deploys. */
      (function () {
        var KEY = 'dv:boot-reload-at';
        try {
          var last = Number(sessionStorage.getItem(KEY) || 0);
          if (Date.now() - last < 30000) return;
        } catch (e) { /* storage unavailable — skip guard */ }
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) {}
            window.location.reload();
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
